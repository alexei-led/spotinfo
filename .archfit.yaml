version: 1
# Balanced-Coupling advisory tuning.
coupling:
  # Minimum severity for a coupling advisory: low|medium|high|critical
  min_severity: medium
languages:
  go:
    enabled: true
  python:
    enabled: false
  typescript:
    enabled: false
  rust:
    enabled: false
# Opt-in analyzers (deeper facts; off by default). Uncomment to enable.
# analyzers:
#   syntax: { enabled: true }       # ast-grep: roles, routes, exported surface
#   scip: { enabled: true }         # symbol-level coupling strength
#   complexity: { enabled: true }   # cyclomatic complexity hotspots
#   clones: { enabled: true }       # cross-module duplication

# Off-gate LLM for `archfit enrich` / `explain --llm` (never used by analyze).
# ai:
#   provider: anthropic   # anthropic | openai | ollama
#   model: claude-opus-4-8
#   base_url: ""          # ollama only

# Intended dependency direction, most depended-on first. The neutral domain
# knows nothing; the legacy AWS package is being migrated behind it; providers
# adapt one cloud each; adapters expose the result; cmd composes.
layers:
  - domain
  - legacy
  - provider
  - adapter
  - cmd

# owner is uniform because this repository has one maintainer. Declaring a
# fictional team split would change Balanced-Coupling distance and quietly
# reclassify existing findings.
modules:
  cloud:
    paths:
      - internal/cloud/**
    public:
      - internal/cloud
    layer: domain
    owner: spotinfo
    role: core
    subdomain: core
    # medium, not low: the neutral contract is still being shaped through the
    # multi-cloud migration. Revisit once GCP and Azure have landed.
    volatility: medium
  snapshot:
    paths:
      - internal/snapshot/**
    public:
      - internal/snapshot
    layer: domain
    owner: spotinfo
    role: core
    subdomain: core
    # medium: the manifest and source-contract shapes are still settling as GCP
    # and Azure snapshots land. Revisit once both providers have shipped.
    volatility: medium
  spot:
    paths:
      - internal/spot/**
    public:
      - internal/spot
    layer: legacy
    owner: spotinfo
    role: core
    subdomain: core
    # high: it tracks two AWS feeds that a weekly workflow refreshes.
    volatility: high
  reproducible:
    paths:
      - internal/reproducible/**
    public:
      - internal/reproducible
    layer: domain
    owner: spotinfo
    role: core
    subdomain: generic
    # low: it encodes a committed payload reproducibly. Build-time only — the
    # shipped binary does not link it — and its shape changes only if the gzip
    # reproducibility rule does.
    volatility: low
  providers:
    paths:
      - internal/providers/*.go
    public:
      - internal/providers
    layer: provider
    owner: spotinfo
    role: core
    subdomain: core
    # medium: registrations change as each provider lands, the registry contract
    # itself does not.
    volatility: medium
  providers_aws:
    paths:
      - internal/providers/aws/**
    public:
      - internal/providers/aws
    layer: provider
    owner: spotinfo
    role: adapter
    subdomain: core
    volatility: medium
  providers_gcp:
    paths:
      - internal/providers/gcp/**
    public:
      - internal/providers/gcp
    layer: provider
    owner: spotinfo
    role: adapter
    subdomain: core
    # medium: it reads a committed catalogue and its manifest. The parser that
    # tracks Google's page restyles now lives in cmd/update-gcp-data, so this
    # package changes with the catalogue schema, not with the pages.
    volatility: medium
  providers_azure:
    paths:
      - internal/providers/azure/**
    public:
      - internal/providers/azure
    layer: provider
    owner: spotinfo
    role: adapter
    subdomain: core
    # medium: it reads a committed catalogue and its manifest. The Retail Prices
    # join and the Learn size-page parser now live in cmd/update-azure-data, so
    # this package changes with the catalogue schema, not with the sources.
    volatility: medium
  cmd_update_azure_data:
    paths:
      - cmd/update-azure-data/**
    public:
      - cmd/update-azure-data
    layer: cmd
    owner: spotinfo
    role: composition_root
    subdomain: generic
    # high: it owns the Retail Prices join and the Learn size-page parser, whose
    # sources Microsoft restyles on its own schedule. Build-time only.
    volatility: high
  cmd_update_gcp_data:
    paths:
      - cmd/update-gcp-data/**
    public:
      - cmd/update-gcp-data
    layer: cmd
    owner: spotinfo
    role: composition_root
    subdomain: generic
    # high: it owns the pricing-page parser, whose source is a set of public HTML
    # pages Google restyles on its own schedule. Build-time only.
    volatility: high
  mcp:
    paths:
      - internal/mcp/**
    public:
      - internal/mcp
    layer: adapter
    owner: spotinfo
    role: adapter
    subdomain: supporting
    volatility: medium
  cmd_archfitcheck:
    paths:
      - cmd/archfitcheck/**
    public:
      - cmd/archfitcheck
    layer: cmd
    owner: spotinfo
    role: composition_root
    subdomain: generic
    # low: it reads an archfit report and exits. Its shape changes only when
    # archfit's own report shape does.
    volatility: low
  cmd_spotinfo:
    paths:
      - cmd/spotinfo/**
    public:
      - cmd/spotinfo
    layer: cmd
    owner: spotinfo
    role: composition_root
    subdomain: generic
    volatility: medium
rules:
  # Promoted from warn now that both the pre-Task-3 graph and the registry graph
  # pass it with zero violations. It fails the build if a provider ever imports
  # cmd/spotinfo or internal/mcp, or if the neutral domain reaches back up.
  # internal/cloud/dependencies_test.go covers the same intent at package level.
  #
  # Balanced-Coupling advisories stay warnings for this rule gate: their
  # severity is enforced by cmd/archfitcheck, which `make verify-architecture`
  # runs over the analysis and which fails on any open Critical or High finding.
  - id: no-layer-back-edges
    type: forbidden_layer_direction
    gate: fail
  # Each provider adapter owns one cloud. Sibling imports would bypass the
  # neutral seam and make one provider's source/parser changes affect another.
  - id: providers_gcp_no_aws
    type: forbidden_dependency
    from: internal/providers/gcp/**
    to: internal/providers/aws
    gate: fail
  - id: providers_gcp_no_azure
    type: forbidden_dependency
    from: internal/providers/gcp/**
    to: internal/providers/azure
    gate: fail
  - id: providers_aws_no_gcp
    type: forbidden_dependency
    from: internal/providers/aws/**
    to: internal/providers/gcp
    gate: fail
  - id: providers_aws_no_azure
    type: forbidden_dependency
    from: internal/providers/aws/**
    to: internal/providers/azure
    gate: fail
  - id: providers_azure_no_aws
    type: forbidden_dependency
    from: internal/providers/azure/**
    to: internal/providers/aws
    gate: fail
  - id: providers_azure_no_gcp
    type: forbidden_dependency
    from: internal/providers/azure/**
    to: internal/providers/gcp
    gate: fail
