# Generated by archfit init — TODO: review and promote gate: warn to gate: fail
version: 1
# Balanced-Coupling advisory tuning.
coupling:
  # Minimum severity for a coupling advisory: low|medium|high|critical
  min_severity: medium
languages:
  go:
    enabled: true
  python:
    enabled: false
  typescript:
    enabled: false
  rust:
    enabled: false
# Opt-in analyzers (deeper facts; off by default). Uncomment to enable.
# analyzers:
#   syntax: { enabled: true }       # ast-grep: roles, routes, exported surface
#   scip: { enabled: true }         # symbol-level coupling strength
#   complexity: { enabled: true }   # cyclomatic complexity hotspots
#   clones: { enabled: true }       # cross-module duplication

# Off-gate LLM for `archfit enrich` / `explain --llm` (never used by analyze).
# ai:
#   provider: anthropic   # anthropic | openai | ollama
#   model: claude-opus-4-8
#   base_url: ""          # ollama only
layers:
  - core
  - cmd
modules:
  cmd_spotinfo:
    paths:
      - cmd/spotinfo/**
    public:
      - cmd/spotinfo
    layer: cmd
    # subdomain: generic  # llm-suggested — review and uncomment
    # volatility: medium  # llm-suggested — review and uncomment
    # owner: cli-team  # llm-suggested — review and uncomment
    # role: composition_root  # llm-suggested — review and uncomment
    # llm layer: cmd
  mcp:
    paths:
      - internal/mcp/**
    public:
      - internal/mcp
    layer: core
    # subdomain: supporting  # llm-suggested — review and uncomment
    # volatility: medium  # llm-suggested — review and uncomment
    # owner: mcp-integrations  # llm-suggested — review and uncomment
    # role: adapter  # llm-suggested — review and uncomment
    # llm layer: core
  spot:
    paths:
      - internal/spot/**
    public:
      - internal/spot
    layer: core
    # subdomain: core  # llm-suggested — review and uncomment
    # volatility: high  # llm-suggested — review and uncomment
    # owner: spot-pricing  # llm-suggested — review and uncomment
    # role: core  # llm-suggested — review and uncomment
    # llm layer: core
rules:
  - id: no-layer-back-edges
    type: forbidden_layer_direction
    gate: warn
