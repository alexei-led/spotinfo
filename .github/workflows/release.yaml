name: Release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
      - '[0-9]+.[0-9]+.[0-9]+*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Get version
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # Add 'v' prefix if not present for release name
          if [[ $TAG_NAME =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            RELEASE_VERSION="v${TAG_NAME}"
          else
            RELEASE_VERSION="${TAG_NAME}"
          fi
          echo "VERSION=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build release binaries
        run: make release VERSION=${{ steps.version.outputs.VERSION }} GITHUB_RELEASE=${{ steps.version.outputs.RELEASE_VERSION }}
      # Idempotent on purpose. `gh release create` fails outright when the release
      # already exists, which it does whenever a maintainer publishes notes by hand
      # before the tag workflow runs — and because the step aborts, the binaries
      # never upload and the homebrew dispatch below never fires. That is how
      # v3.0.0 shipped with zero assets. Re-running the job could not repair it
      # either, since the failure is the create call itself.
      #
      # Uploading with --clobber makes the whole job safe to re-run: a fresh tag
      # takes the create path, an existing release takes the upload path, and a
      # partial upload can be completed by running the job again.
      - name: Create or update release
        run: |
          TAG='${{ steps.version.outputs.VERSION }}'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; uploading binaries to it"
            gh release upload "$TAG" .bin/* --clobber
          else
            gh release create "$TAG" \
              --title "${{ steps.version.outputs.RELEASE_VERSION }}" \
              --generate-notes \
              .bin/*
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # A separate job on purpose, not a step in `release`.
  #
  # This used to be the last step of the release job, so any earlier step
  # failing took the formula update down with it. That is exactly what happened
  # on v3.0.0: `gh release create` failed on an existing release, the job
  # aborted, and Homebrew sat on 2.5.0 while the release page said 3.0.0.
  # `needs: release` still orders it after a successful release, but a failure
  # inside that job can no longer swallow this one silently.
  update-homebrew:
    name: Update Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Dispatch formula update
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_UPDATE_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Fail loudly on a missing token. A dispatch without one returns 404,
          # which reads like a wrong repository rather than a missing secret.
          if [[ -z "$GH_TOKEN" ]]; then
            printf '%s\n' 'TAP_UPDATE_TOKEN is required to update alexei-led/homebrew-tap.' >&2
            exit 1
          fi
          # The tap strips a leading v itself, but sending it clean keeps the
          # payload readable in the dispatch log.
          curl --fail-with-body --retry 3 --retry-all-errors \
            --request POST \
            --url 'https://api.github.com/repos/alexei-led/homebrew-tap/dispatches' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$(jq --null-input \
              --arg formula 'spotinfo' \
              --arg version "${VERSION#v}" \
              --arg repo "$GITHUB_REPOSITORY" \
              '{event_type: "update-formula", client_payload: {formula: $formula, version: $version, repo: $repo}}')"
